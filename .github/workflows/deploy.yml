# Automatic Vercel deployment on every push to main.
# Replaces Vercel's native Git integration — the deploy runs here via CLI + token.
#
# Required secret (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN — created at vercel.com/account/settings/tokens (scoped to this project)
#
# The IDs below identify the project but grant no access without the token.
name: Deploy to Vercel

on:
  push:
    branches: [main]

env:
  VERCEL_ORG_ID: team_Y8ErgVyEV7Rn0TQ3m8TQEEq9
  VERCEL_PROJECT_ID: prj_FS0orcKTAwMo1hWuWsaYr5k1otbh

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy (production)
        run: npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
